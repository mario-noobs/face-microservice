---
# Project identity
project_name: face-microservice
registry: ghcr.io/mario-noobs
deploy_user: face
deploy_dir: "/opt/{{ project_name }}"

# Feature flags — infra managed out of band via scripts/infra-up.sh
has_mysql: false
has_redis: false
has_minio: false
has_rabbitmq: false
has_elasticsearch: false

network_external: true

# Observability
enable_monitoring: true
enable_log_rotation: true
docker_log_max_size: "100m"
docker_log_max_files: 3

# Docker compose
compose_file: "docker-compose.yml"
network_name: "{{ project_name }}"

# Project-specific file paths for baseline roles
_project_ansible_dir: "{{ inventory_dir | dirname | dirname }}"
app_deploy_nginx_template: "{{ _project_ansible_dir }}/files/nginx.conf.j2"
app_deploy_init_sql: "{{ _project_ansible_dir }}/files/init.sql"

# Env-specific
environment: production
domain: "face-app.example.com"
ssl_enabled: true

# Resource tuning
mysql_buffer_pool_size: "512M"
mysql_max_connections: 200
redis_maxmemory: "256mb"
swap_size_mb: 4096

# Deploy settings
force_pull: true
