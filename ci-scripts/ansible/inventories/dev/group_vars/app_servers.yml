---
app_services:
  backend-service:
    image: "{{ registry }}/backend-service"
    tag: "latest"
    port: 8080
    health_check: "/ping"
    health_check_interval: 30
    env:
      SPRING_PROFILES_ACTIVE: "dev"
      SERVER_PORT: "8080"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_NAME: "backend_db"
      DB_USERNAME: "root"
      DB_PASSWORD: "root_password_secret_tcp"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      JWT_SECRET: "dmVyeS1pbXBvcnRhbnQtcGxlYXNlLWNoYW5nZS1pdC1pbi1wcm9kdWN0aW9uLXdpdGgtYXQtbGVhc3QtMjU2LWJpdHM="
      JWT_ACCESS_TOKEN_EXPIRATION: "3600000"
      JWT_REFRESH_TOKEN_EXPIRATION: "604800000"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "admin"
      MINIO_SECRET_KEY: "123456789"
      MINIO_BUCKET: "face-images"
      FACE_SERVICE_URL: "http://face-ai-service:5000"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "guest"
      RABBITMQ_PASSWORD: "guest"
      ELASTICSEARCH_URIS: "http://elasticsearch:9200"
    resources:
      memory: "640M"
    depends_on:
      - mysql
      - redis
      - minio
      - rabbitmq
      - elasticsearch
    java_opts: "-Xmx384m -Xms256m -XX:+UseG1GC"

  face-ai-service:
    image: "{{ registry }}/face-ai-service"
    tag: "latest"
    port: 5000
    env:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    resources:
      memory: "1792M"
    depends_on:
      - redis

  gui-app:
    image: "{{ registry }}/gui-app"
    tag: "latest"
    port: 80
    resources:
      memory: "128M"
    depends_on:
      - backend-service

infra_services:
  mysql:
    enabled: "{{ has_mysql }}"
    image: "mysql:8.0"
    port: 3306
    env:
      MYSQL_ROOT_PASSWORD: "root_password_secret_tcp"
      MYSQL_DATABASE: "backend_db"
    volumes:
      - "mysql_data:/var/lib/mysql"
    command: >-
      --innodb-buffer-pool-size={{ mysql_buffer_pool_size }}
      --max-connections={{ mysql_max_connections }}
    resources:
      memory: "512M"
    health_check_cmd: "mysqladmin ping -h localhost"

  redis:
    enabled: "{{ has_redis }}"
    image: "redis:7.4-alpine"
    port: 6379
    command: "redis-server --maxmemory {{ redis_maxmemory }} --maxmemory-policy allkeys-lru"
    volumes:
      - "redis_data:/data"
    resources:
      memory: "96M"
    health_check_cmd: "redis-cli ping"

  minio:
    enabled: "{{ has_minio }}"
    image: "quay.io/minio/minio"
    port: 9000
    console_port: 9001
    env:
      MINIO_ROOT_USER: "admin"
      MINIO_ROOT_PASSWORD: "123456789"
    volumes:
      - "minio_data:/data"
    command: "server /data --console-address ':9001'"
    resources:
      memory: "256M"
    health_check_cmd: "curl -f http://localhost:9000/minio/health/live"

  rabbitmq:
    enabled: "{{ has_rabbitmq }}"
    image: "rabbitmq:3.13-management-alpine"
    port: 5672
    console_port: 15672
    volumes:
      - "rabbitmq_data:/var/lib/rabbitmq"
    resources:
      memory: "256M"
    health_check_cmd: "rabbitmq-diagnostics -q ping"

  elasticsearch:
    enabled: "{{ has_elasticsearch }}"
    image: "docker.elastic.co/elasticsearch/elasticsearch:8.11.0"
    port: 9200
    env:
      node.name: "elasticsearch"
      cluster.name: "face-microservice-cluster"
      discovery.type: "single-node"
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    volumes:
      - "elasticsearch_data:/usr/share/elasticsearch/data"
    resources:
      memory: "768M"
    health_check_cmd: "curl -sf http://localhost:9200/_cluster/health"
