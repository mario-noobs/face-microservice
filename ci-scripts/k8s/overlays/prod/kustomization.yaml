apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production uses managed services (RDS, ElastiCache, S3).
# Infra StatefulSets are scaled to 0 — the ConfigMaps point to managed endpoints instead.
resources:
  - ../../base

patches:
  - path: patches/hpa-prod.yaml
  - path: patches/ingress-tls.yaml
  - path: patches/infra-scale-zero.yaml

# Override ConfigMaps for managed service endpoints
configMapGenerator:
  - name: backend-config
    namespace: face-app
    behavior: replace
    literals:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=production
      - DB_HOST=CHANGE_ME_RDS_ENDPOINT
      - DB_PORT=3306
      - DB_NAME=backend_db
      - DB_USERNAME=CHANGE_ME
      - REDIS_HOST=CHANGE_ME_ELASTICACHE_ENDPOINT
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=CHANGE_ME_S3_ENDPOINT
      - MINIO_BUCKET=face-images
      - FACE_SERVICE_URL=http://face-recognition-service.face-app.svc.cluster.local:5000
      - RABBITMQ_HOST=CHANGE_ME_AMAZONMQ_ENDPOINT
      - RABBITMQ_PORT=5672
      - ELASTICSEARCH_URIS=CHANGE_ME_ES_ENDPOINT
      - JWT_ACCESS_TOKEN_EXPIRATION=900000
      - JWT_REFRESH_TOKEN_EXPIRATION=604800000
      - FRONTEND_URL=https://face-app.example.com
  - name: face-service-config
    namespace: face-app
    behavior: replace
    literals:
      - FLASK_ENV=production
      - MODEL_S3_ENDPOINT=CHANGE_ME_S3_ENDPOINT
      - MODEL_S3_BUCKET=face-models
      - MODEL_CACHE_DIR=/app/model_cache
      - ENABLED_MODELS=retinaface_mobilenet,facenet_mobilenet
      - LOG_LEVEL=WARNING

secretGenerator:
  - name: backend-secret
    namespace: face-app
    type: Opaque
    literals:
      - DB_PASSWORD=CHANGE_ME_PROD
      - JWT_SECRET=CHANGE_ME_PROD_JWT_SECRET_BASE64
      - MINIO_ACCESS_KEY=CHANGE_ME_PROD
      - MINIO_SECRET_KEY=CHANGE_ME_PROD
      - RABBITMQ_USERNAME=CHANGE_ME_PROD
      - RABBITMQ_PASSWORD=CHANGE_ME_PROD
      - VAULT_TOKEN=CHANGE_ME_PROD
  - name: face-service-secret
    namespace: face-app
    type: Opaque
    literals:
      - MODEL_S3_ACCESS_KEY=CHANGE_ME_PROD
      - MODEL_S3_SECRET_KEY=CHANGE_ME_PROD

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: backend-service
    newName: ghcr.io/mario-noobs/backend-service
    newTag: latest
  - name: face-recognition-service
    newName: ghcr.io/mario-noobs/face-recognition-service
    newTag: latest
  - name: gui-app
    newName: ghcr.io/mario-noobs/gui-app
    newTag: latest

commonLabels:
  app.kubernetes.io/part-of: face-microservice
