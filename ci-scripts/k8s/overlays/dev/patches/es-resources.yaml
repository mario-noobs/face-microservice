apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: face-infra
spec:
  template:
    spec:
      containers:
        - name: elasticsearch
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          env:
            - name: ES_JAVA_OPTS
              value: "-Xms256m -Xmx256m"
