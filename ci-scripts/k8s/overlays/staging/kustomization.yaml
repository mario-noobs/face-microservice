apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: patches/backend-resources.yaml

secretGenerator:
  - name: backend-secret
    namespace: face-app
    type: Opaque
    literals:
      - DB_PASSWORD=CHANGE_ME_STAGING
      - JWT_SECRET=CHANGE_ME_STAGING_JWT_SECRET_BASE64
      - MINIO_ACCESS_KEY=CHANGE_ME
      - MINIO_SECRET_KEY=CHANGE_ME
      - RABBITMQ_USERNAME=CHANGE_ME
      - RABBITMQ_PASSWORD=CHANGE_ME
      - VAULT_TOKEN=CHANGE_ME
  - name: face-service-secret
    namespace: face-app
    type: Opaque
    literals:
      - MODEL_S3_ACCESS_KEY=CHANGE_ME
      - MODEL_S3_SECRET_KEY=CHANGE_ME

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: backend-service
    newName: ghcr.io/mario-noobs/backend-service
    newTag: latest
  - name: face-recognition-service
    newName: ghcr.io/mario-noobs/face-recognition-service
    newTag: latest
  - name: gui-app
    newName: ghcr.io/mario-noobs/gui-app
    newTag: latest
