apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: face-app-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: face-microservice
    environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: face-microservice
  source:
    repoURL: https://github.com/mario-noobs/face-microservice.git
    targetRevision: develop
    path: ci-scripts/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
