apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: face-app
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: face-microservice
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z minio.face-infra.svc.cluster.local 9000; do echo "Waiting for MinIO..."; sleep 3; done']
      containers:
        - name: minio-init
          image: minio/mc:latest
          command:
            - sh
            - -c
            - |
              mc alias set myminio http://minio.face-infra.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing myminio/face-models
              mc mb --ignore-existing myminio/face-images
              echo "MinIO buckets initialized"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MINIO_SECRET_KEY
