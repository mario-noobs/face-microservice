apiVersion: v1
kind: ConfigMap
metadata:
  name: db-migration-common
  namespace: face-app
data:
  2026.02.17_01__add_algorithm_reg_column.sql: |
    -- Add algorithm_reg column to face_features table
    -- Tracks which detection+recognition algorithm pair was used during registration
    ALTER TABLE face_features
    ADD COLUMN algorithm_reg VARCHAR(50) DEFAULT 'facenet_mobilenet' AFTER feature_vector;

  2026.02.18_01__create_user_profiles_table.sql: |
    CREATE TABLE IF NOT EXISTS user_profiles (
        id              BIGINT AUTO_INCREMENT PRIMARY KEY,
        user_id         BIGINT NOT NULL UNIQUE,
        -- Personal
        gender          ENUM('male', 'female', 'other', 'prefer_not_to_say') DEFAULT NULL,
        date_of_birth   DATE DEFAULT NULL,
        avatar_url      VARCHAR(500) DEFAULT NULL,
        display_name    VARCHAR(100) DEFAULT NULL,
        bio             TEXT DEFAULT NULL,
        -- Address
        address_line_1  VARCHAR(255) DEFAULT NULL,
        address_line_2  VARCHAR(255) DEFAULT NULL,
        city            VARCHAR(128) DEFAULT NULL,
        state           VARCHAR(128) DEFAULT NULL,
        postal_code     VARCHAR(40) DEFAULT NULL,
        country         VARCHAR(2) DEFAULT NULL COMMENT 'ISO 3166-1 alpha-2',
        -- Timestamps
        created_at      DATETIME DEFAULT CURRENT_TIMESTAMP,
        updated_at      DATETIME DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
        CONSTRAINT fk_user_profiles_user FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

  2026.02.18_02__enrich_audit_logs.sql: |
    -- Enrich audit_logs with actor/action/target/outcome fields
    ALTER TABLE audit_logs
      ADD COLUMN actor_email  VARCHAR(255) DEFAULT NULL AFTER user_id,
      ADD COLUMN actor_role   VARCHAR(50)  DEFAULT NULL AFTER actor_email,
      ADD COLUMN action       VARCHAR(100) DEFAULT NULL AFTER actor_role,
      ADD COLUMN target_type  VARCHAR(50)  DEFAULT NULL AFTER action,
      ADD COLUMN target_id    VARCHAR(100) DEFAULT NULL AFTER target_type,
      ADD COLUMN outcome      VARCHAR(20)  DEFAULT NULL AFTER target_id;

    CREATE INDEX idx_audit_logs_action ON audit_logs(action);
    CREATE INDEX idx_audit_logs_outcome ON audit_logs(outcome);
    CREATE INDEX idx_audit_logs_target_type ON audit_logs(target_type);

  2026.02.18_03__add_password_reset_fields.sql: |
    -- Add password reset token fields to auths table
    ALTER TABLE auths
      ADD COLUMN reset_token        VARCHAR(100) DEFAULT NULL,
      ADD COLUMN reset_token_expiry DATETIME     DEFAULT NULL;

    CREATE INDEX idx_auths_reset_token ON auths(reset_token);

  2026.02.18_04__add_invitation_fields.sql: |
    -- Add invitation token fields to auths table
    ALTER TABLE auths
      ADD COLUMN invitation_token        VARCHAR(100) DEFAULT NULL,
      ADD COLUMN invitation_token_expiry DATETIME     DEFAULT NULL;

    CREATE INDEX idx_auths_invitation_token ON auths(invitation_token);
