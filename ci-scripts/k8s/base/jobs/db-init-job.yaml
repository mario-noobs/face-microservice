apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: face-app
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/part-of: face-microservice
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mysql.face-infra.svc.cluster.local 3306; do echo "Waiting for MySQL..."; sleep 3; done']
      containers:
        - name: db-init
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              mysql -h mysql.face-infra.svc.cluster.local -u root -p"$MYSQL_ROOT_PASSWORD" backend_db < /sql/init.sql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: db-init-sql
