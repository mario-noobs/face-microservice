apiVersion: apps/v1
kind: Deployment
metadata:
  name: face-recognition-service
  namespace: face-app
  labels:
    app: face-recognition-service
    app.kubernetes.io/part-of: face-microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: face-recognition-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: face-recognition-service
        app.kubernetes.io/part-of: face-microservice
    spec:
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - 'until nc -z minio.face-infra.svc.cluster.local 9000; do echo "Waiting for MinIO..."; sleep 3; done'
      containers:
        - name: face-recognition-service
          image: face-recognition-service:latest
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: face-service-config
            - secretRef:
                name: face-service-secret
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 4Gi
          volumeMounts:
            - name: model-cache
              mountPath: /app/model_cache
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: face-model-cache
