services:
  # ==================== Infrastructure ====================
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root_password_secret_tcp
      - MYSQL_DATABASE=backend_db
    volumes:
      - mysql:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - face
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: redis
    volumes:
      - redis:/data
    networks:
      - face
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: "123456789"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - face
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - face
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault-init:
    image: hashicorp/vault:1.15
    container_name: vault-init
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    volumes:
      - ./vault:/vault
    networks:
      - face
    depends_on:
      vault:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/vault/dev-init.sh"]
    restart: "no"

  # ==================== Backend (Java Modular Monolith) ====================
  backend-service:
    build:
      context: ./backend-service
      dockerfile: Dockerfile
    container_name: backend-service
    ports:
      - "8080:8080"
    environment:
      # Server
      - SERVER_PORT=8080
      # Database
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=backend_db
      - DB_USERNAME=root
      - DB_PASSWORD=root_password_secret_tcp
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # JWT (secret must be base64 encoded, expiration in milliseconds)
      - JWT_SECRET=dmVyeS1pbXBvcnRhbnQtcGxlYXNlLWNoYW5nZS1pdC1pbi1wcm9kdWN0aW9uLXdpdGgtYXQtbGVhc3QtMjU2LWJpdHM=
      - JWT_ACCESS_TOKEN_EXPIRATION=3600000
      - JWT_REFRESH_TOKEN_EXPIRATION=604800000
      # MinIO
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=123456789
      - MINIO_BUCKET=face-images
      # Face Recognition Service
      - FACE_SERVICE_URL=http://face-recognition-service:5000
      # Vault
      - SPRING_PROFILES_ACTIVE=dev
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-root-token
    networks:
      - face
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== AI Service (Python) ====================
  face-recognition-service:
    build: ./face-regconition-service
    container_name: face-recognition-service
    networks:
      - face
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

  # ==================== Frontend ====================
  app-fe:
    build: ./gui-app
    container_name: app-fe
    ports:
      - "80:80"
    networks:
      - face
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VITE_APP_API_URL=/api
    depends_on:
      backend-service:
        condition: service_healthy
    restart: on-failure

  # ==================== Logging Stack (Optional) ====================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    profiles:
      - logging
    environment:
      - node.name=elasticsearch
      - cluster.name=face-microservice-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - face
    restart: unless-stopped

  fluent-bit:
    image: fluent/fluent-bit:3.1.9
    container_name: fluent-bit
    profiles:
      - logging
    ports:
      - "24224:24224"
      - "2020:2020"
    volumes:
      - ./logging/fluent-bit-simple.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./logging/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    networks:
      - face
    depends_on:
      - elasticsearch
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    profiles:
      - logging
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana
      - XPACK_SECURITY_ENABLED=false
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=a7a6311933d3503b89bc2dbc36572c4a
    networks:
      - face
    depends_on:
      - elasticsearch
    restart: unless-stopped

networks:
  face:
    driver: bridge

volumes:
  mysql:
  redis:
  minio-data:
  vault-data:
  elasticsearch-data:
