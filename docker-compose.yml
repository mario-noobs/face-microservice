services:
  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root_password_secret_tcp
      - MYSQL_DATABASE=todo-list
    volumes:
      - mysql:/var/lib/mysql
      - ./data.sql:/docker-entrypoint-initdb.d/data.sql
    networks:
      - face
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis:/data
    networks:
      - face
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

  face-regconition-service:
    build: ./face-regconition-service
    networks:
      - face
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "fluentd"
      options:
        fluentd-address: localhost:24224
        tag: "{{.Name}}"

  face-reg-engine:
    build: ./face-reg-engine
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/face-db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root_password_secret_tcp
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - MINIO_URL=http://minio
      - MINIO_PORT=9000
      - MINIO_USERNAME=admin
      - MINIO_PASSWORD=123456789$
      - MINIO_BUCKET=face-bucket
      - MINIO_AUTOCREATE=true
        #- FACE_HOST_NAME=http://host.docker.internal:5000
    networks:
      - face
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    restart: on-failure
    logging:
      driver: "fluentd"
      options:
        fluentd-address: localhost:24224
        tag: "{{.Name}}"

  auth-service:
    build: ./auth-service
    environment:
      - DB_DSN=root:root_password_secret_tcp@tcp(mysql:3306)/auth-db?charset=utf8mb4&parseTime=True&loc=Local
      - GIN_PORT=3100
      - GRPC_PORT=3101
      - GRPC_USER_ADDRESS=user-service:3201
      - JWT_SECRET=very-important-please-change-it!
      - JWT_ACCESS_TOKEN_EXPIRY=15m
      - JWT_REFRESH_TOKEN_EXPIRY=7d
      - TOKEN_CLEANUP_INTERVAL=1h
      - REDIS_URL=redis:6379
    networks:
      - face
    # ports:
    #   - "3101:3101"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "fluentd"
      options:
        fluentd-address: localhost:24224
        tag: "{{.Name}}"

  user-service:
    build: ./profile-service
    environment:
      - DB_DSN=root:root_password_secret_tcp@tcp(mysql:3306)/user-db?charset=utf8mb4&parseTime=True&loc=Local
      - GIN_PORT=3200
      - GRPC_PORT=3201
      - GRPC_AUTH_ADDRESS=auth-service:3101
    # ports:
    #   - "3201:3201"
    networks:
      - face
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: "fluentd"
      options:
        fluentd-address: localhost:24224
        tag: "{{.Name}}"
    
  ai-backend-service:
    build: ./ai-backend-service
    # ports:
    #   - "3000:3000"
    environment:
      - DB_DSN=root:root_password_secret_tcp@tcp(mysql:3306)/ai-backend-service-db?charset=utf8mb4&parseTime=True&loc=Local
      - GIN_PORT=3000
      - GRPC_AUTH_USER_ADDRESS=auth-service:3101
      - GRPC_PROFILE_ADDRESS=user-service:3201
      # - FACE_HOST=http://host.docker.internal:8080/face/v1/api/
    networks:
      - face
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: "fluentd"
      options:
        fluentd-address: localhost:24224
        tag: "{{.Name}}"

  app-fe:
    build: ./gui-app
    ports:
      - "80:80"   # only expose frontend
    networks:
      - face
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VITE_APP_API_URL=/gateway
    depends_on:
      ai-backend-service:
        condition: service_started
    logging:
      driver: "fluentd"
      options:
        fluentd-address: localhost:24224
        tag: "{{.Name}}"

  
  minio:
    image: quay.io/minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 123456789$
    ports:
      - "9000:9000"   # API port for SDK/app
      - "9001:9001"   # Console port for web UI
    volumes:
      - ./data:/data
    networks:
      - face
    command: server /data --console-address ":9001"

  # Centralized Logging Stack with ELK
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=face-microservice-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - face
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  fluent-bit:
    image: fluent/fluent-bit:3.1.9
    container_name: fluent-bit
    ports:
      - "24224:24224"
      - "2020:2020"
    volumes:
      - ./logging/fluent-bit-simple.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./logging/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    networks:
      - face
    depends_on:
      - elasticsearch
    restart: unless-stopped
    environment:
      - FLB_CONFIG_FILE=/fluent-bit/etc/fluent-bit.conf
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana
      - XPACK_SECURITY_ENABLED=false
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=a7a6311933d3503b89bc2dbc36572c4a
    networks:
      - face
    depends_on:
      - elasticsearch
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m



networks:
  face:
    driver: bridge

volumes:
  mysql:
  redis:
  elasticsearch-data:

