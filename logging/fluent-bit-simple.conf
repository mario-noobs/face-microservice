# Simplified Fluent Bit Configuration
# This configuration avoids the "Too many open files" issue by only using forward input
# All container logs come through Docker's fluentd logging driver

[SERVICE]
    Flush         5
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    Health_Check  On
    # Reduce memory usage and file descriptors
    storage.max_chunks_up    64
    storage.metrics          on

# Primary input: Forward from Docker containers
[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 512KB
    Buffer_Max_Size   2M

# Add metadata to all logs
[FILTER]
    Name                modify
    Match               *
    Add                 cluster face-microservice
    Add                 environment development

# Parse JSON content from log field (without timestamp parsing to avoid format conflicts)
[FILTER]
    Name                parser
    Match               *
    Key_Name            log
    Parser              json_no_time
    Reserve_Data        On
    Preserve_Key        On

# Output to Elasticsearch (Regular Indices) - ES 8.x Compatible
[OUTPUT]
    Name                es
    Match               *
    Host                elasticsearch
    Port                9200
    Index               face-microservice-logs-%Y.%m.%d
    Retry_Limit         5
    Tag_Key             container_name
    Suppress_Type_Name  On
    Generate_ID         On
    Replace_Dots        On
    Trace_Error         On
    Trace_Output        On
    Current_Time_Index  On
    Include_Tag_Key     On
