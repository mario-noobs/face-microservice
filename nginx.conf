server {
    listen 80;

    # Serve frontend build
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Proxy API routes to backend services (internal only)
    location /api/ {
        proxy_pass http://ai-backend-service:3000/;
    }

    location /auth/ {
        proxy_pass http://auth-service:3100/;
    }

    location /user/ {
        proxy_pass http://user-service:3200/;
    }
}
