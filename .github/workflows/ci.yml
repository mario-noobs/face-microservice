name: 🛠️ CI Pipeline

on:
  push:
    branches:
      - master
      - 30-setup-ci-pipeline
  pull_request:
    branches: [ master ]

jobs:
  # --- Java (face-reg-engine) ---
  java-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build & Test
        working-directory: face-reg-engine
        run: ./gradlew build

  # --- Python (face-regconition-service) ---
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Debug files
        run: ls -l face-regconition-service

      - name: Install dependencies
        working-directory: face-regconition-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: face-regconition-service
        run: pytest

  # --- Node.js (gui-app) ---
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies with pnpm
        working-directory: gui-app
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install
          pnpm --version

      - name: Run lint & build
        working-directory: gui-app
        run: |
          pnpm lint
          pnpm build
