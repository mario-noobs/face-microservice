name: CI - Backend Service

on:
  push:
    branches:
      - "release/*"
      - develop
  pull_request:
    branches: [ develop ]

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: temurin

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: backend_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests, JaCoCo report, and coverage gate
        working-directory: backend-service
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: backend_db
          DB_USERNAME: root
          DB_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1jZC1waXBlbGluZS1hdC1sZWFzdC0yNTYtYml0cw==
        run: ./gradlew clean test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload JaCoCo XML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml-report
          path: backend-service/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: backend-service/build/reports/jacoco/test/html/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend-service/build/reports/tests/test/

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: sonar

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download JaCoCo XML report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-xml-report
          path: backend-service/build/reports/jacoco/test/

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Compile and run SonarCloud analysis
        working-directory: backend-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: ./gradlew compileJava sonar

  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from branch name
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          VERSION=${GITHUB_REF#refs/heads/release/}
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Detected release version: ${VERSION}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          TAG=${RELEASE_VERSION:-ci}
          docker build -t backend-service:${TAG} ./backend-service
          echo "Built image: backend-service:${TAG}"

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend-service:${{ env.RELEASE_VERSION || 'ci' }}
          severity: CRITICAL,HIGH
          exit-code: 0

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [ sonarcloud, docker-build ]
    if: startsWith(github.ref, 'refs/heads/release/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        run: |
          VERSION=${GITHUB_REF#refs/heads/release/}
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=v${VERSION}" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release JAR
        working-directory: backend-service
        run: ./gradlew clean bootJar -x test

      - name: Generate release notes
        run: |
          {
            echo "## What's Changed"
            echo ""

            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "### Commits since ${PREV_TAG}"
              echo ""
              git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges
            else
              echo "### Commits"
              echo ""
              git log --pretty=format:"- %s (%h)" --no-merges -20
            fi

            echo ""
            echo ""
            echo "## Artifacts"
            echo ""
            echo "| Artifact | Version |"
            echo "|----------|---------|"
            echo "| JAR | \`backend-service-${RELEASE_VERSION}.jar\` |"
            echo "| Docker | \`backend-service:${RELEASE_VERSION}\` |"
            echo ""
            echo "## Contributors"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log ${PREV_TAG}..HEAD --pretty=format:"- @%an" | sort -u
            else
              git log --pretty=format:"- @%an" -20 | sort -u
            fi
            echo ""
          } > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" \
            --title "Release ${RELEASE_VERSION}" \
            --notes-file release_notes.md \
            backend-service/build/libs/backend-service-${RELEASE_VERSION}.jar