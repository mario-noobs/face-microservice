name: 🛠️ CI Pipeline

on:
  push:
    branches:
      - "release/*"
      - develop
  pull_request:
    branches: [ develop ]

jobs:
  # --- Java (face-reg-engine) ---
  java-build:
    runs-on: ubuntu-latest
    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Debug workspace layout
        run: |
          echo "Check key files:"
          [ -f face-reg-engine/gradlew ] && echo "gradlew exists" || echo "gradlew missing"


      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build & Test
        working-directory: ./face-reg-engine
        run: ./gradlew clean test build

  # --- Python (face-regconition-service) ---
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Debug workspace layout
        run: |
          echo "Check key files:"
          [ -f face-regconition-service/requirements.txt ] && echo "requirements.txt exists" || echo "requirements.txt missing"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies & Run tests
        working-directory: ./face-regconition-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python tests/run_tests.py

  # --- Node.js (gui-app) ---
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Debug workspace layout
        run: |
          echo "Check key files:"
          [ -f gui-app/package.json ] && echo "package.json exists" || echo "package.json missing"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./gui-app
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install
          pnpm --version

      - name: Run linting (non-blocking)
        working-directory: ./gui-app
        run: pnpm lint
        continue-on-error: true

      - name: Build application
        working-directory: ./gui-app
        run: pnpm build
