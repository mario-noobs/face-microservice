name: 🛠️ CI Pipeline

on:
  push:
    branches:
      - master
      - 30-setup-ci-pipeline
  pull_request:
    branches: [ master ]

jobs:
  # --- Java (face-reg-engine) ---
  java-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: face-reg-engine
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build & Test
        run: ./gradlew build

  # --- Python (face-regconition-service) ---
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: face-regconition-service
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest

  # --- Node.js (gui-app) ---
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui-app
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install deps
        run: |
          npm install -g pnpm
          pnpm install
      - name: Run lint & build
        run: |
          pnpm lint
          pnpm build
