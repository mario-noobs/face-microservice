name: CI - Backend Service

on:
  push:
    branches:
      - "release/*"
      - develop
  pull_request:
    branches: [ develop ]

permissions:
  contents: write

jobs:
  ci:
    uses: mario-noobs/ci-baseline/.github/workflows/_ci-java.yml@main
    with:
      working_directory: backend-service
      gradle_tasks: "clean test jacocoTestReport jacocoTestCoverageVerification"
      sonar_project_key: mario-noobs_face-microservice
      sonar_organization: mario-noobs
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from branch name
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          VERSION=${GITHUB_REF#refs/heads/release/}
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Detected release version: ${VERSION}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          TAG=${RELEASE_VERSION:-ci}
          docker build -t backend-service:${TAG} ./backend-service
          echo "Built image: backend-service:${TAG}"

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend-service:${{ env.RELEASE_VERSION || 'ci' }}
          severity: CRITICAL,HIGH
          exit-code: 0

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [ ci, docker-build ]
    if: startsWith(github.ref, 'refs/heads/release/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from branch name
        run: |
          VERSION=${GITHUB_REF#refs/heads/release/}
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=v${VERSION}" >> $GITHUB_ENV

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release JAR
        working-directory: backend-service
        run: ./gradlew clean bootJar -x test

      - name: Generate release notes
        run: |
          {
            echo "## What's Changed"
            echo ""

            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              echo "### Commits since ${PREV_TAG}"
              echo ""
              git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges
            else
              echo "### Commits"
              echo ""
              git log --pretty=format:"- %s (%h)" --no-merges -20
            fi

            echo ""
            echo ""
            echo "## Artifacts"
            echo ""
            echo "| Artifact | Version |"
            echo "|----------|---------|"
            echo "| JAR | \`backend-service-${RELEASE_VERSION}.jar\` |"
            echo "| Docker | \`backend-service:${RELEASE_VERSION}\` |"
            echo ""
            echo "## Contributors"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log ${PREV_TAG}..HEAD --pretty=format:"- @%an" | sort -u
            else
              git log --pretty=format:"- @%an" -20 | sort -u
            fi
            echo ""
          } > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" \
            --title "Release ${RELEASE_VERSION}" \
            --notes-file release_notes.md \
            backend-service/build/libs/backend-service-${RELEASE_VERSION}.jar
