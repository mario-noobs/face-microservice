name: CD

on:
  workflow_run:
    workflows:
      - "CI - Backend Service"
      - "CI - Face Recognition Service"
      - "CI - GUI App"
    types: [completed]
    branches: [develop]

jobs:
  resolve-image:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.resolve.outputs.image_name }}
      image_full: ${{ steps.resolve.outputs.image_full }}
    steps:
      - name: Resolve image from workflow name
        id: resolve
        run: |
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHA:0:7}"

          case "$WORKFLOW_NAME" in
            "CI - Backend Service")
              IMAGE_NAME="backend-service"
              ;;
            "CI - Face Recognition Service")
              IMAGE_NAME="face-recognition-service"
              ;;
            "CI - GUI App")
              IMAGE_NAME="gui-app"
              ;;
            *)
              echo "Unknown workflow: $WORKFLOW_NAME"
              exit 1
              ;;
          esac

          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "image_full=ghcr.io/mario-noobs/$IMAGE_NAME:sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"

  update-dev:
    needs: resolve-image
    uses: mario-noobs/ci-baseline/.github/workflows/_cd-update-image.yml@main
    with:
      orchestrator_repo: mario-noobs/face-microservice
      orchestrator_branch: develop
      overlay_path: ci-scripts/k8s/overlays/dev
      image_name: ${{ needs.resolve-image.outputs.image_name }}
      image_full: ${{ needs.resolve-image.outputs.image_full }}
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
